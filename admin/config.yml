backend:
  name: github
  repo: coexistence-walk/coexistence-walk.de
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog_posts"   # ✅ geändert
    label: "Blog Verwaltung"
    files:
      - label: "Alle Blog Beiträge"
        name: "posts_file"   # ✅ geändert
        file: "blog-data.json"
        fields:
          - label: "Beiträge"
            name: "entries"   # ✅ geändert
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Veröffentlichungsdatum", name: "date", widget: "datetime" }
              - { label: "Vorschaubild", name: "thumbnail", widget: "image", required: false }
              - { label: "Inhalt", name: "body", widget: "markdown" }
