<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Blog Admin</title>
</head>
<body>

<h2>Blog Editor</h2>

<input id="token" placeholder="GitHub Token" style="width:300px;"><br><br>
<input id="title" placeholder="Titel"><br><br>
<textarea id="content" placeholder="Inhalt" rows="10" cols="50"></textarea><br><br>

<button onclick="savePost()">Speichern</button>

<script>
async function savePost() {
  const token = document.getElementById("token").value;
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;

  const repo = "coexistence-walk/coexistence-walk.de";
  const path = "blog-data.json";

  // 1. Datei laden
  const getFile = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  const fileData = await getFile.json();
  const sha = fileData.sha;

  let json = JSON.parse(atob(fileData.content));

  // 2. neuen Beitrag hinzufügen
  json.items.push({
    title: title,
    date: new Date().toISOString(),
    body: content
  });

  // 3. speichern
  await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: "PUT",
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: "Neuer Blogpost",
      content: btoa(JSON.stringify(json, null, 2)),
      sha: sha
    })
  });

  alert("Gespeichert!");
}
</script>

</body>
</html>
